x="560" y="189" width="166" height="13" class="f-blue" fill-opacity=".85"/><text x="732" y="200" class="m">5.81 MB</text><text x="520" y="230" class="m">p95</text><rect x="560" y="210" width="282" height="13" class="f-muted" fill-opacity=".85"/><text x="848" y="221" class="m">99.1 MB</text><rect x="560" y="225" width="189.5" height="13" class="f-blue" fill-opacity=".85"/><text x="755.5" y="236" class="m">10.3 MB</text><text x="520" y="266" class="m">max</text><rect x="560" y="246" width="282.5" height="13" class="f-muted" fill-opacity=".85"/><text x="848.5" y="257" class="m">100.33 MB</text><rect x="560" y="261" width="282.5" height="13" class="f-blue" fill-opacity=".85"/><text x="848.5" y="272" class="m">100.26 MB</text><rect x="560" y="281" width="14" height="12" class="f-muted" /><text x="580" y="292">before compression</text><rect x="716.8" y="281" width="14" height="12" class="f-blue" /><text x="736.8" y="292">after compression</text><text x="20" y="350" class="h">Query latency, ms (measured, p50 / p95 / p99)</text><text x="20" y="390" class="b">latestPerConnectorForStation</text><rect x="330" y="368" width="12.8" height="11" class="f-teal" fill-opacity=".85"/><text x="347.8" y="378" class="m">p50 5.28</text><rect x="330" y="382" width="56.7" height="11" class="f-blue" fill-opacity=".85"/><text x="391.7" y="392" class="m">p95 23.36</text><rect x="330" y="396" width="88.9" height="11" class="f-purple" fill-opacity=".85"/><text x="423.9" y="406" class="m">p99 36.59</text><text x="20" y="440" class="b">power1mOneSiteOneDayCompressed</text><rect x="330" y="418" width="12.1" height="11" class="f-teal" fill-opacity=".85"/><text x="347.1" y="428" class="m">p50 5</text><rect x="330" y="432" width="23.9" height="11" class="f-blue" fill-opacity=".85"/><text x="358.9" y="442" class="m">p95 9.82</text><rect x="330" y="446" width="31.5" height="11" class="f-purple" fill-opacity=".85"/><text x="366.5" y="456" class="m">p99 12.96</text><text x="20" y="490" class="b">power1mOneSiteOneDayRecent</text><rect x="330" y="468" width="12.7" height="11" class="f-teal" fill-opacity=".85"/><text x="347.7" y="478" class="m">p50 5.24</text><rect x="330" y="482" width="30.3" height="11" class="f-blue" fill-opacity=".85"/><text x="365.3" y="492" class="m">p95 12.47</text><rect x="330" y="496" width="46.6" height="11" class="f-purple" fill-opacity=".85"/><text x="381.6" y="506" class="m">p99 19.18</text><text x="20" y="540" class="b">sessionReadingsCompressedChunks</text><rect x="330" y="518" width="18.7" height="11" class="f-teal" fill-opacity=".85"/><text x="353.7" y="528" class="m">p50 7.7</text><rect x="330" y="532" width="33" height="11" class="f-blue" fill-opacity=".85"/><text x="368" y="542" class="m">p95 13.58</text><rect x="330" y="546" width="69.5" height="11" class="f-purple" fill-opacity=".85"/><text x="404.5" y="556" class="m">p99 28.6</text><text x="20" y="590" class="b">sessionReadingsRecentChunks</text><rect x="330" y="568" width="4.9" height="11" class="f-teal" fill-opacity=".85"/><text x="339.9" y="578" class="m">p50 2.02</text><rect x="330" y="582" width="8.4" height="11" class="f-blue" fill-opacity=".85"/><text x="343.4" y="592" class="m">p95 3.45</text><rect x="330" y="596" width="10.4" height="11" class="f-purple" fill-opacity=".85"/><text x="345.4" y="606" class="m">p99 4.29</text><rect x="20" y="611" width="14" height="12" class="f-teal" /><text x="40" y="622">p50</text><rect x="77.8" y="611" width="14" height="12" class="f-blue" /><text x="97.8" y="622">p95</text><rect x="135.6" y="611" width="14" height="12" class="f-purple" /><text x="155.6" y="622">p99</text><text x="600" y="350" class="h">Full fleet, 90 days raw + 2 years of rollups</text><text x="600" y="368" class="bad">DERIVED, not measured</text><text x="600" y="399" class="b">raw, 90 days</text><rect x="730" y="384" width="61.4" height="20" class="f-purple" fill-opacity=".30" stroke-width="2" stroke-dasharray="5 3" style="stroke:var(--purple)"/><text x="797.4" y="399" class="m">59.4 GB</text><text x="600" y="435" class="b">power_1m, 2 years</text><rect x="730" y="420" width="88.6" height="20" class="f-purple" fill-opacity=".30" stroke-width="2" stroke-dasharray="5 3" style="stroke:var(--purple)"/><text x="824.6" y="435" class="m">85.7 GB</text><text x="600" y="471" class="b">total</text><rect x="730" y="456" width="150" height="20" class="f-purple" fill-opacity=".30" stroke-width="2" stroke-dasharray="5 3" style="stroke:var(--purple)"/><text x="886" y="471" class="m">145.1 GB</text><text x="600" y="508" font-size="12" class="m mono">212.9 B/row uncompressed =</text><text x="600" y="524" font-size="12" class="m mono">beforeCompressionTotalBytes / rowsInserted</text><text x="600" y="540" font-size="12" class="m mono">(table + indexes)</text><text x="600" y="556" font-size="12" class="m mono">20.7 B/row compressed = bytesPerRowUncompressed</text><text x="600" y="572" font-size="12" class="m mono">* compressedChunksAfterBytes /</text><text x="600" y="588" font-size="12" class="m mono">compressedChunksBeforeBytes</text><text x="600" y="604" font-size="12" class="m mono">raw = rowsPerDayFullFleet *</text><text x="600" y="620" font-size="12" class="m mono">(bytesPerRowCompressed * 89 +</text><text x="600" y="636" font-size="12" class="m mono">bytesPerRowUncompressed * 1)</text><text x="600" y="652" font-size="12" class="m mono">rollup = power1mRows / days * (50000 / stations)</text><text x="600" y="668" font-size="12" class="m mono">* (7 * rollupBytesPerRowUncompressed + 723 *</text><text x="600" y="684" font-size="12" class="m mono">rollupBytesPerRowCompressed)</text>
<line x1="20" y1="716" x2="960" y2="716" class="grid" /><text x="20" y="738" font-size="12" class="m mono">Source: docs/load-output/telemetry-backfill-20261108T082949Z.json.</text><text x="20" y="755" font-size="12" class="m mono">Setup: 5000 stations x 2 connectors, 7 days (2026-11-01T08:00:00Z to 2026-11-08T08:00:00Z), one reading every 30 s, mean</text><text x="20" y="772" font-size="12" class="m mono">utilisation 0.1, seed 1, 300 runs per query. Derived assumptions: 50,000 stations, 90 days raw (last 1 day uncompressed), 2</text><text x="20" y="789" font-size="12" class="m mono">years of power_1m (first 7 days uncompressed, then compressed), same per-station profile as measured.</text><text x="20" y="806" font-size="12" class="m mono">Background policy jobs (compression, cagg refresh, retention) were paused during the run and re-enabled afterwards; compression</text><text x="20" y="823" font-size="12" class="m mono">and refresh were run manually.</text>
</svg>

s measured, target ≥ 2,500 /s</text><rect x="420" y="296" width="163.1" height="22" class="f-red" fill-opacity=".85"/><text x="591.1" y="312" class="m">0.99×</text><rect x="820" y="297" width="54" height="22" class="f-red" rx="5"/><text x="847" y="313" text-anchor="middle" font-size="12" class="b on">MISS</text><text x="34" y="349" class="b">Durable lag p99 (at the target rate)</text><text x="34" y="367" class="m">942.95 ms measured, target ≤ 5,000 ms</text><rect x="420" y="342" width="31.1" height="22" class="f-green" fill-opacity=".85"/><text x="459.1" y="358" class="m">0.19×</text><rect x="820" y="343" width="54" height="22" class="f-green" rx="5"/><text x="847" y="359" text-anchor="middle" font-size="12" class="b on">PASS</text><text x="34" y="395" class="b">Loss ratio at the target rate</text><text x="34" y="413" class="m">0 measured, target ≤ 0.0001 (derived)</text><rect x="420" y="388" width="0" height="22" class="f-green" fill-opacity=".85"/><text x="428" y="404" class="m">0</text><rect x="820" y="389" width="54" height="22" class="f-green" rx="5"/><text x="847" y="405" text-anchor="middle" font-size="12" class="b on">PASS</text><text x="20" y="446" class="h">sessions</text><text x="34" y="469" class="b">Commands per second (StartTransaction + StopTransaction)</text><text x="34" y="487" class="m">199.99 /s measured, target ≥ 200 /s</text><rect x="420" y="462" width="165" height="22" class="f-green" fill-opacity=".85"/><text x="593" y="478" class="m">1×</text><rect x="820" y="463" width="54" height="22" class="f-green" rx="5"/><text x="847" y="479" text-anchor="middle" font-size="12" class="b on">PASS</text><text x="20" y="520" class="h">smart-charging</text><text x="34" y="543" class="b">Allocation p99 (open loop at the target rate)</text><text x="34" y="561" class="m">19.45 ms measured, target ≤ 20 ms</text><rect x="420" y="536" width="160.5" height="22" class="f-green" fill-opacity=".85"/><text x="588.5" y="552" class="m">0.97×</text><rect x="820" y="537" width="54" height="22" class="f-green" rx="5"/><text x="847" y="553" text-anchor="middle" font-size="12" class="b on">PASS</text><text x="34" y="589" class="b">Allocations per second (k6, service)</text><text x="34" y="607" class="m">999.97 /s measured, target ≥ 1,000 /s</text><rect x="420" y="582" width="165" height="22" class="f-green" fill-opacity=".85"/><text x="593" y="598" class="m">1×</text><rect x="820" y="583" width="54" height="22" class="f-green" rx="5"/><text x="847" y="599" text-anchor="middle" font-size="12" class="b on">PASS</text><text x="20" y="640" class="h">tariff</text><text x="34" y="663" class="b">Quote p99 (open loop at the target rate)</text><text x="34" y="681" class="m">13.9 ms measured, target ≤ 20 ms</text><rect x="420" y="656" width="114.7" height="22" class="f-green" fill-opacity=".85"/><text x="542.7" y="672" class="m">0.69×</text><rect x="820" y="657" width="54" height="22" class="f-green" rx="5"/><text x="847" y="673" text-anchor="middle" font-size="12" class="b on">PASS</text><text x="34" y="709" class="b">Quotes per second (k6, service)</text><text x="34" y="727" class="m">1,999.97 /s measured, target ≥ 2,000 /s</text><rect x="420" y="702" width="165" height="22" class="f-green" fill-opacity=".85"/><text x="593" y="718" class="m">1×</text><rect x="820" y="703" width="54" height="22" class="f-green" rx="5"/><text x="847" y="719" text-anchor="middle" font-size="12" class="b on">PASS</text><text x="20" y="760" class="h">driver-api</text><text x="34" y="783" class="b">Read requests per second (GET /v1/sites)</text><text x="34" y="801" class="m">955.59 /s measured, target ≥ 1,000 /s</text><rect x="420" y="776" width="157.7" height="22" class="f-red" fill-opacity=".85"/><text x="585.7" y="792" class="m">0.96×</text><rect x="820" y="777" width="54" height="22" class="f-red" rx="5"/><text x="847" y="793" text-anchor="middle" font-size="12" class="b on">MISS</text><text x="34" y="829" class="b">Read p99</text><text x="34" y="847" class="m">255.2 ms measured, target ≤ 300 ms</text><rect x="420" y="822" width="140.4" height="22" class="f-green" fill-opacity=".85"/><text x="568.4" y="838" class="m">0.85×</text><rect x="820" y="823" width="54" height="22" class="f-green" rx="5"/><text x="847" y="839" text-anchor="middle" font-size="12" class="b on">PASS</text><text x="20" y="878" class="m">Verdicts compare the measured value with the ADR 0000 target; k6 throughput rows within 0.1% with no dropped iteration</text><text x="20" y="895" class="m">and no failed request count as met (ADR 0000 rate rule).</text>
<line x1="20" y1="916" x2="960" y2="916" class="grid" /><text x="20" y="938" font-size="12" class="m mono">Sources: docs/load-output/gateway-10k-connections.json, docs/load-output/k6-driver-api-reads.json,</text><text x="20" y="955" font-size="12" class="m mono">docs/load-output/k6-gateway-ws-2000st-1hz.json, docs/load-output/k6-sessions-ocpp-rate200.json,</text><text x="20" y="972" font-size="12" class="m mono">docs/load-output/k6-smart-charging.json, docs/load-output/k6-tariff.json, docs/load-output/smart-charging-allocbench.json,</text><text x="20" y="989" font-size="12" class="m mono">docs/load-output/tariff-quotebench-openloop.json, docs/load-output/telemetry-ingestbench.json, load/targets.json.</text><text x="20" y="1006" font-size="12" class="m mono">Setup (gateway-10k-connections.json): ONE native node process (no docker), real Redis and Kafka (3 brokers, RF 3, acks=all)</text><text x="20" y="1023" font-size="12" class="m mono">from compose host ports, raw-log publishing ON, GATEWAY_MAX_UPGRADES_PER_S=3000 (default 300 is sized for 167 reconnects/s),</text><text x="20" y="1040" font-size="12" class="m mono">other settings default</text><text x="20" y="1057" font-size="12" class="m mono">Setup (k6-gateway-ws-2000st-1hz.json): gateway-ws-2000st-1hz: grafana/k6 container on the compose network, measured</text><text x="20" y="1074" font-size="12" class="m mono">2026-11-08T11:34:53Z, darwin/arm64, Docker VM 8 CPUs / 8.3 GB, single instance of each service; all containers share one Docker</text><text x="20" y="1091" font-size="12" class="m mono">VM.</text><text x="20" y="1108" font-size="12" class="m mono">Setup (telemetry-ingestbench.json): All figures measured by this tool in one process (producer + one telemetry-ingest pipeline</text><text x="20" y="1125" font-size="12" class="m mono">instance) against the lab compose Kafka (3 brokers, RF 3, acks=all) and TimescaleDB on the same Docker VM. Lag = durable DB</text><text x="20" y="1142" font-size="12" class="m mono">commit time minus reading timestamp (stamped at produce time). Go go1.27.3, 8 CPUs, 24 partitions, flush 5000 rows or 250 ms,</text><text x="20" y="1159" font-size="12" class="m mono">buffer 50000 rows.</text><text x="20" y="1176" font-size="12" class="m mono">Setup (k6-sessions-ocpp-rate200.json): sessions-ocpp-rate200: grafana/k6 container on the compose network, measured</text><text x="20" y="1193" font-size="12" class="m mono">2026-11-08T11:17:35Z, darwin/arm64, Docker VM 8 CPUs / 8.3 GB, single instance of each service; all containers share one Docker</text><text x="20" y="1210" font-size="12" class="m mono">VM.</text><text x="20" y="1227" font-size="12" class="m mono">Setup (smart-charging-allocbench.json): client and server on the same machine; latency is client-observed end to end over</text><text x="20" y="1244" font-size="12" class="m mono">HTTP/1.1 keep-alive Go go1.27.3, darwin/arm64, 8 CPUs, 2000 synthetic sites (mean 15.37 sessions each).</text><text x="20" y="1261" font-size="12" class="m mono">Setup (k6-smart-charging.json): smart-charging: grafana/k6 container on the compose network, measured 2026-11-08T10:21:06Z,</text><text x="20" y="1278" font-size="12" class="m mono">darwin/arm64, Docker VM 8 CPUs / 8.3 GB, single instance of each service; all containers share one Docker VM.</text><text x="20" y="1295" font-size="12" class="m mono">Setup (tariff-quotebench-openloop.json): same machine as the server; the load generator shares host CPU; server</text><text x="20" y="1312" font-size="12" class="m mono">GOMAXPROCS=2(cgroup),DB_MAX_CONNS=8, CPU limit 2; Go go1.27.3, 8 CPUs.</text><text x="20" y="1329" font-size="12" class="m mono">Setup (k6-tariff.json): tariff: grafana/k6 container on the compose network, measured 2026-11-08T10:22:14Z, darwin/arm64,</text><text x="20" y="1346" font-size="12" class="m mono">Docker VM 8 CPUs / 8.3 GB, single instance of each service; all containers share one Docker VM.</text><text x="20" y="1363" font-size="12" class="m mono">Setup (k6-driver-api-reads.json): driver-api-reads: grafana/k6 container on the compose network, measured 2026-11-08T11:25:54Z,</text><text x="20" y="1380" font-size="12" class="m mono">darwin/arm64, Docker VM 8 CPUs / 8.3 GB, single instance of each service; all containers share one Docker VM.</text>
</svg>

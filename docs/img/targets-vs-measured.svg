<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1391" width="980" height="1391" role="img" aria-labelledby="t d">
<title id="t">Per-instance targets versus measured values</title><desc id="d">Per-instance targets from ADR 0000; every bar is the measured value divided by its target.</desc>
<style>
svg{--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#818b98;--blue:#0969da;--orange:#bc4c00;--green:#1a7f37;--red:#cf222e;--purple:#8250df;--teal:#0e7c86;--card:rgba(129,139,152,.10);--on:#fff}

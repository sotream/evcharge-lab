<line x1="20" y1="456" x2="960" y2="456" class="grid" /><text x="20" y="478" font-size="12" class="m mono">Source: docs/load-output/telemetry-ingestbench.json; target from load/targets.json.</text><text x="20" y="495" font-size="12" class="m mono">Setup: All figures measured by this tool in one process (producer + one telemetry-ingest pipeline instance) against the lab</text><text x="20" y="512" font-size="12" class="m mono">compose Kafka (3 brokers, RF 3, acks=all) and TimescaleDB on the same Docker VM. Lag = durable DB commit time minus reading</text><text x="20" y="529" font-size="12" class="m mono">timestamp (stamped at produce time). Go go1.27.3, 8 CPUs, 24 partitions, Kafka localhost:29091,localhost:29092,localhost:29093,</text><text x="20" y="546" font-size="12" class="m mono">flush 5000 rows or 250 ms, buffer 50000 rows; COPY into staging, then INSERT … ON CONFLICT: 6 offered rates; row-by-row INSERT</text><text x="20" y="563" font-size="12" class="m mono">(baseline): 4 offered rates.</text>
</svg>

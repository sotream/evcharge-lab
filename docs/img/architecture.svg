<marker id="aws" viewBox="0 0 10 10" refX="1" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto"><path d="M10 0L0 5L10 10z" fill="#0e7490"/></marker>

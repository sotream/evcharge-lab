<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 990" width="1280" height="990" role="img" aria-labelledby="t d">
<title id="t">evcharge-lab architecture</title>
<desc id="d">Stations connect over WebSockets through HAProxy to two station-gateway instances. Gateways call sessions over HTTP. Sessions calls smart-charging. Drivers use driver-api over HTTPS, which calls sessions, billing and telemetry-ingest. Services exchange events through a three-broker Kafka cluster. Postgres holds OLTP data, a separate Postgres with TimescaleDB holds telemetry, and Redis holds routes and caches.</desc>

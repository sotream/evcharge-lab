<line x1="20" y1="762" x2="960" y2="762" class="grid" /><text x="20" y="784" font-size="12" class="m mono">Sources: docs/load-output/gateway-10k-connections.json; docs/load-output/k6-gateway-ws-1000st-1hz.json,</text><text x="20" y="801" font-size="12" class="m mono">docs/load-output/k6-gateway-ws-2000st-1hz.json; load/targets.json.</text><text x="20" y="818" font-size="12" class="m mono">Setup (10k run): ONE native node process (no docker), real Redis and Kafka (3 brokers, RF 3, acks=all) from compose host ports,</text><text x="20" y="835" font-size="12" class="m mono">raw-log publishing ON, GATEWAY_MAX_UPGRADES_PER_S=3000 (default 300 is sized for 167 reconnects/s), other settings default.</text><text x="20" y="852" font-size="12" class="m mono">Simulator: separate process: 10000 stations (1000 sites x 10), SIM_TIME_SCALE=20, SIM_START 18:00 UTC (evening peak), connect</text><text x="20" y="869" font-size="12" class="m mono">ramp 1000/s. Machine: 8 logical CPUs, darwin arm64; gateway, simulator, runner, Redis and Kafka all share this one machine.</text><text x="20" y="886" font-size="12" class="m mono">Setup (k6): grafana/k6 container on the compose network; darwin/arm64; Docker VM 8 CPUs and 8.3 GB; single instance of each</text><text x="20" y="903" font-size="12" class="m mono">service; all containers share one Docker VM. Measured 2026-11-08T11:33:22Z to 2026-11-08T11:34:53Z; the containers running</text><text x="20" y="920" font-size="12" class="m mono">during each run are listed in k6-gateway-ws-1000st-1hz.env.json, k6-gateway-ws-2000st-1hz.env.json. Vertical tick = p99</text><text x="20" y="937" font-size="12" class="m mono">threshold in the k6 script.</text>
</svg>

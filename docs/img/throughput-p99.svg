<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 608" width="980" height="608" role="img" aria-labelledby="t d">
<title id="t">Throughput and p99 latency per service (k6)</title><desc id="d">Latency metric: ocpp_callresult_ms for the gateway, http_req_duration{scenario:open} for driver-api, http_req_duration otherwise.</desc>
<style>
svg{--fg:#1f2328;--muted:#59636e;--grid:#d1d9e0;--axis:#818b98;--blue:#0969da;--orange:#bc4c00;--green:#1a7f37;--red:#cf222e;--purple:#8250df;--teal:#0e7c86;--card:rgba(129,139,152,.10);--on:#fff}
@media (prefers-color-scheme: dark){svg{--fg:#e6edf3;--muted:#9198a1;--grid:#3d444d;--axis:#6e7681;--blue:#58a6ff;--orange:#f0883e;--green:#3fb950;--red:#ff7b72;--purple:#d2a8ff;--teal:#39c5cf;--card:rgba(110,118,129,.16);--on:#0d1117}}
text{fill:var(--fg);font-family:system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;font-size:12px}
.t{font-size:18px;font-weight:700}.st{fill:var(--muted);font-size:13px}.h{font-size:14px;font-weight:700}
.m{fill:var(--muted)}.b{font-weight:700}.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.grid{stroke:var(--grid);stroke-width:1}.axis{stroke:var(--axis);stroke-width:1}
.card{fill:var(--card)}
.f-blue{fill:var(--blue)}.f-orange{fill:var(--orange)}.f-green{fill:var(--green)}.f-red{fill:var(--red)}.f-purple{fill:var(--purple)}.f-teal{fill:var(--teal)}.f-muted{fill:var(--muted)}
.s-blue{stroke:var(--blue)}.s-orange{stroke:var(--orange)}.s-green{stroke:var(--green)}.s-red{stroke:var(--red)}.s-purple{stroke:var(--purple)}.s-teal{stroke:var(--teal)}.s-muted{stroke:var(--muted)}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.dash{stroke-dasharray:6 4}
.on{fill:var(--on)}
.ok{fill:var(--green);font-weight:700}.bad{fill:var(--red);font-weight:700}
</style>
<text x="20" y="28" class="t">Throughput and p99 latency per service (k6)</text><text x="20" y="48" class="st">Latency metric: ocpp_callresult_ms for the gateway, http_req_duration{scenario:open} for driver-api, http_req_duration otherwise.</text>
<text x="440" y="68" text-anchor="middle" class="h">Achieved rate (log scale)</text><text x="775" y="68" text-anchor="middle" class="h">p99 latency, ms (log scale)</text><line x1="290" y1="86" x2="290" y2="386" class="grid" /><text x="290" y="82" text-anchor="middle" class="m">10</text><line x1="390" y1="86" x2="390" y2="386" class="grid" /><text x="390" y="82" text-anchor="middle" class="m">100</text><line x1="490" y1="86" x2="490" y2="386" class="grid" /><text x="490" y="82" text-anchor="middle" class="m">1,000</text><line x1="590" y1="86" x2="590" y2="386" class="grid" /><text x="590" y="82" text-anchor="middle" class="m">10,000</text><line x1="650" y1="86" x2="650" y2="386" class="grid" /><text x="650" y="82" text-anchor="middle" class="m">1</text><line x1="712.5" y1="86" x2="712.5" y2="386" class="grid" /><text x="712.5" y="82" text-anchor="middle" class="m">10</text><line x1="775" y1="86" x2="775" y2="386" class="grid" /><text x="775" y="82" text-anchor="middle" class="m">100</text><line x1="837.5" y1="86" x2="837.5" y2="386" class="grid" /><text x="837.5" y="82" text-anchor="middle" class="m">1,000</text><line x1="900" y1="86" x2="900" y2="386" class="grid" /><text x="900" y="82" text-anchor="middle" class="m">10,000</text><text x="20" y="117" class="b">station-gateway, 1000 stations</text><rect x="290" y="104" width="195.9" height="20" class="f-blue" fill-opacity=".85"/><text x="491.9" y="119" class="m">910.28 msg/s</text><rect x="650" y="104" width="197.5" height="20" class="f-red" fill-opacity=".85"/><text x="855.5" y="119" class="m">1,446 ms</text><line x1="818.7" y1="99" x2="818.7" y2="129" class="axis" style="stroke:var(--fg);stroke-width:2.5"/><text x="20" y="157" class="b">station-gateway, 2000 stations</text><rect x="290" y="144" width="239.6" height="20" class="f-blue" fill-opacity=".85"/><text x="535.6" y="159" class="m">2,490.23 msg/s</text><rect x="650" y="144" width="150.2" height="20" class="f-green" fill-opacity=".85"/><text x="826.7" y="159" class="m">253 ms</text><line x1="818.7" y1="139" x2="818.7" y2="169" class="axis" style="stroke:var(--fg);stroke-width:2.5"/><text x="20" y="197" class="b">station-gateway, 2000 stations</text><rect x="290" y="184" width="205.7" height="20" class="f-blue" fill-opacity=".85"/><text x="501.7" y="199" class="m">1,139.03 msg/s</text><rect x="650" y="184" width="219.3" height="20" class="f-red" fill-opacity=".85"/><text x="877.3" y="199" class="m">3,228 ms</text><line x1="818.7" y1="179" x2="818.7" y2="209" class="axis" style="stroke:var(--fg);stroke-width:2.5"/><text x="20" y="237" class="b">sessions (highest rate of the sweep)</text><rect x="290" y="224" width="130.1" height="20" class="f-blue" fill-opacity=".85"/><text x="426.1" y="239" class="m">199.99 commands/s</text><rect x="650" y="224" width="136.9" height="20" class="f-green" fill-opacity=".85"/><text x="826.7" y="239" class="m">155.3 ms</text><line x1="818.7" y1="219" x2="818.7" y2="249" class="axis" style="stroke:var(--fg);stroke-width:2.5"/><text x="20" y="277" class="b">driver-api reads</text><rect x="290" y="264" width="198" height="20" class="f-blue" fill-opacity=".85"/><text x="494" y="279" class="m">955.59 req/s</text><rect x="650" y="264" width="150.4" height="20" class="f-green" fill-opacity=".85"/><text x="812.8" y="279" class="m">255.2 ms</text><line x1="804.8" y1="259" x2="804.8" y2="289" class="axis" style="stroke:var(--fg);stroke-width:2.5"/><text x="20" y="317" class="b">smart-charging (k6 against the service)</text><rect x="290" y="304" width="200" height="20" class="f-blue" fill-opacity=".85"/><text x="496" y="319" class="m">999.97 alloc/s</text><rect x="650" y="304" width="66.8" height="20" class="f-green" fill-opacity=".85"/><text x="739.3" y="319" class="m">11.7 ms</text><line x1="731.3" y1="299" x2="731.3" y2="329" class="axis" style="stroke:var(--fg);stroke-width:2.5"/><text x="20" y="357" class="b">tariff (k6 against the service)</text><rect x="290" y="344" width="230.1" height="20" class="f-blue" fill-opacity=".85"/><text x="526.1" y="359" class="m">1,999.97 quotes/s</text><rect x="650" y="344" width="44.4" height="20" class="f-green" fill-opacity=".85"/><text x="739.3" y="359" class="m">5.1 ms</text><line x1="731.3" y1="339" x2="731.3" y2="369" class="axis" style="stroke:var(--fg);stroke-width:2.5"/><rect x="650" y="397" width="14" height="12" class="f-green" /><text x="670" y="408">p99 within threshold</text><rect x="820" y="397" width="14" height="12" class="f-red" /><text x="840" y="408">p99 over threshold</text><text x="20" y="408" class="m">Vertical tick = the p99 threshold in the k6 script.</text>
<line x1="20" y1="422" x2="960" y2="422" class="grid" /><text x="20" y="444" font-size="12" class="m mono">Sources: docs/load-output/k6-gateway-ws-1000st-1hz.json, docs/load-output/k6-gateway-ws-2000st-1.25hz.json,</text><text x="20" y="461" font-size="12" class="m mono">docs/load-output/k6-gateway-ws-2000st-1hz.json, docs/load-output/k6-sessions-ocpp-rate200.json,</text><text x="20" y="478" font-size="12" class="m mono">docs/load-output/k6-driver-api-reads.json, docs/load-output/k6-smart-charging.json, docs/load-output/k6-tariff.json.</text><text x="20" y="495" font-size="12" class="m mono">Rates are k6 http_reqs.count divided by the test run duration, so a run that lasts slightly over 60 s reports a rate slightly</text><text x="20" y="512" font-size="12" class="m mono">under its offered rate.</text><text x="20" y="529" font-size="12" class="m mono">Setup: k6, grafana/k6 container on the compose network; darwin/arm64; Docker VM 8 CPUs and 8.3 GB; single instance of each</text><text x="20" y="546" font-size="12" class="m mono">service; all containers share one Docker VM. Measured 2026-11-08T10:21:06Z to 2026-11-09T12:33:02Z (setups differ between</text><text x="20" y="563" font-size="12" class="m mono">runs); the containers running during each run are listed in k6-gateway-ws-1000st-1hz.env.json,</text><text x="20" y="580" font-size="12" class="m mono">k6-gateway-ws-2000st-1.25hz.env.json, k6-gateway-ws-2000st-1hz.env.json, k6-sessions-ocpp-rate200.env.json,</text><text x="20" y="597" font-size="12" class="m mono">k6-driver-api-reads.env.json, k6-smart-charging.env.json, k6-tariff.env.json.</text>
</svg>

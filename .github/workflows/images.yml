name: images

# Proves that every image builds, on pull requests and on main. Nothing is pushed to a registry (ADR 0020).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build only: no login, no push, no packages permission.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: station-gateway, dockerfile: services/station-gateway/Dockerfile }
          - { name: sessions, dockerfile: services/sessions/Dockerfile }
          - { name: smart-charging, dockerfile: services/smart-charging/Dockerfile }
          - { name: tariff, dockerfile: services/tariff/Dockerfile }
          - { name: billing, dockerfile: services/billing/Dockerfile }
          - { name: telemetry-ingest, dockerfile: services/telemetry-ingest/Dockerfile }
          - { name: driver-api, dockerfile: services/driver-api/Dockerfile }
          - { name: simulator, dockerfile: simulator/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

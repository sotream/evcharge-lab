name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; a job asks for more only if it needs it (none does).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `make check` is the source of truth (ADR 0020): install, contracts drift, topic sync, promtool rule tests,
  # lint, build, typecheck, unit tests, infra up, integration tests, go vet, golangci-lint, go test -race.
  # This job name is the required status check of the protect-main ruleset.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13'
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - run: make check
      - name: Compose logs
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=80
      - name: Stop infra
        if: always()
        run: docker compose down -v

  # Every commit on every branch, not only the working tree.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Config: .gitleaks.toml (default rules plus test and fixture paths only).
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --log-opts="--all" --redact

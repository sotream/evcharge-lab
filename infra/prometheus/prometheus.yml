rule_files:
  - /etc/prometheus/rules/*.yml

global:
  scrape_interval: 5s
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets: [station-gateway-1:8080, station-gateway-2:8080, sessions:8080, billing:8080, driver-api:8080, smart-charging:8080, tariff:8080, telemetry-ingest:8080, simulator:8080]
  - job_name: haproxy
    static_configs: [{ targets: [station-lb:8404] }]
  - job_name: kafka-exporter
    static_configs: [{ targets: [kafka-exporter:9308] }]
  - job_name: postgres-exporter
    static_configs:
      - targets: [postgres-exporter:9187]
        labels: { db: oltp }
      - targets: [postgres-replica-exporter:9187]
        labels: { db: oltp-replica }
      - targets: [postgres-telemetry-exporter:9187]
        labels: { db: telemetry }
  - job_name: redis-exporter
    static_configs: [{ targets: [redis-exporter:9121] }]

# Primary and replica of the OLTP instance (ADR 0015). Mounted through hba_file so it also applies to a data
# directory that was initialised before replication existed. Mirrors the image defaults plus replication access.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
# Streaming replication, only from private address ranges (the compose network).
host    replication     replicator      172.16.0.0/12           scram-sha-256
host    replication     replicator      192.168.0.0/16          scram-sha-256
host    replication     replicator      10.0.0.0/8              scram-sha-256
# Every other client authenticates with a password.
host    all             all             all                     scram-sha-256

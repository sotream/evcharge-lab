# Station WebSocket edge (ADR 0004). leastconn spreads long-lived connections;
# no stickiness is needed because routing to a station goes through the Redis registry.
global
  maxconn 50000
defaults
  mode http
  timeout connect 5s
  timeout client 120s
  timeout server 120s
  timeout tunnel 1h
  option httplog
frontend ocpp
  bind :8080
  default_backend gateways
backend gateways
  balance leastconn
  option httpchk GET /health/ready
  http-check expect status 200
  server gw1 station-gateway-1:8080 check inter 2s fall 2 rise 2 maxconn 20000
  server gw2 station-gateway-2:8080 check inter 2s fall 2 rise 2 maxconn 20000
frontend stats
  bind :8404
  stats enable
  stats uri /
  http-request use-service prometheus-exporter if { path /metrics }
